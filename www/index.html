<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Wedding Day</title><link rel="stylesheet" href="fonts/fonts.css"><style>
:root{--cream:#FBF7F1;--card:#FFFFFF;--ink:#1A1A1A;--muted:#6E6A64;--gold:#A88241;--goldsoft:#F3EBDD;--line:#E7E0D5;--ok:#4F7A55;--warn:#B5523B;--blue:#3E6A8A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:Jost,system-ui,sans-serif;font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
#app{max-width:640px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 14px calc(40px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;margin:0;line-height:1.15}
h1{font-size:30px}h2{font-size:24px}h3{font-size:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.card.tap{cursor:pointer}
.muted{color:var(--muted)}.small{font-size:13px}.warn{color:var(--warn)}.ok{color:var(--ok)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
button{font:inherit;font-weight:500;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer}
button:disabled{opacity:.4}
button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
button.gold{background:var(--gold);color:#fff;border-color:var(--gold)}
button.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:8px 10px}
button.danger{color:var(--warn);border-color:#E9C9BF}
button.armed{background:var(--warn);color:#fff;border-color:var(--warn)}
button.full{width:100%}
button.sm{min-height:36px;padding:6px 10px;font-size:14px}
input,select,textarea{font:inherit;width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink);min-height:44px}
textarea{min-height:90px;resize:vertical}
label.f{display:block;margin:0 0 12px}
label.f span{display:block;font-size:13px;color:var(--muted);margin:0 0 4px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 -14px 12px;padding:2px 14px 6px;scrollbar-width:none;position:sticky;top:0;background:var(--cream);z-index:5}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;border-radius:999px;padding:8px 14px;min-height:40px;font-size:15px}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab .n{opacity:.7;font-size:12px;margin-left:4px}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin-left:5px;vertical-align:middle}
.light{background:var(--goldsoft);border-color:#E6D6BA}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px;text-align:center}
.grid3 b{display:block;font-size:20px;font-family:"Cormorant Garamond",serif}
.grid3 span{font-size:12px;color:var(--muted)}
.now{border-color:var(--gold);border-width:2px}
.big{font-family:"Cormorant Garamond",serif;font-size:24px;font-weight:600}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .tm{font-weight:600;min-width:52px;font-variant-numeric:tabular-nums}
.item.done .txt{color:var(--muted);text-decoration:line-through}
.item.cur{background:var(--goldsoft);margin:0 -14px;padding:12px 14px;border-radius:8px}
.chk{width:28px;height:28px;min-height:28px;flex:none;border:2px solid var(--gold);border-radius:8px;background:#fff;padding:0;display:flex;align-items:center;justify-content:center}
.chk.on{background:var(--gold)}
.chk.on::after{content:"";width:8px;height:14px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-2px)}
.edit-row{display:grid;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.edit-row:first-child{border-top:0}
.two{display:grid;grid-template-columns:124px 1fr auto;gap:6px;align-items:center}
.three{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-items:center}
.x{min-height:44px;width:44px;padding:0;color:var(--warn)}
.pill{display:inline-block;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--goldsoft);color:#7A5B25;white-space:nowrap}
.pill.red{background:#F6E0D9;color:var(--warn)}
.pill.green{background:#E1EDE2;color:var(--ok)}
.msg{background:#FFF4E5;border:1px solid #F1D7AE;border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:14px}
.prog{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--gold)}
a.tel{color:var(--ink);font-weight:500}
.empty{text-align:center;padding:28px 10px;color:var(--muted)}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
pre.copy{white-space:pre-wrap;font:13px/1.4 ui-monospace,monospace;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;max-height:260px;overflow:auto}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.compass{display:flex;gap:14px;align-items:center}
.compass svg{flex:none}
.wx{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.wx::-webkit-scrollbar{display:none}
.wx .h{flex:none;min-width:62px;text-align:center;border:1px solid var(--line);border-radius:10px;padding:8px 4px;font-size:13px}
.wx .h.in{border-color:var(--gold)}
.wx .h b{display:block;font-size:15px}
.wx .rain{color:var(--blue);font-weight:600}
.timer{font-family:"Cormorant Garamond",serif;font-size:34px;font-weight:600;font-variant-numeric:tabular-nums}
.sel{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.sel:first-child{border-top:0}
img.preview{width:100%;border-radius:10px;border:1px solid var(--line)}
label.btn-file{display:block}
.gold-btn{display:block;text-align:center;background:var(--gold);color:#fff;border-radius:10px;padding:11px 14px;font-weight:500;cursor:pointer}
table.log{width:100%;border-collapse:collapse;font-size:14px}
table.log td,table.log th{padding:8px 4px;border-top:1px solid var(--line);text-align:left}
table.log td.n,table.log th.n{text-align:right;font-variant-numeric:tabular-nums}
</style></head><body><div id="app"></div><script>
(function(){
'use strict';
var LS='obwd-v1';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function P(n){try{return window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins[n]||null}catch(e){return null}}
var LN=P('LocalNotifications'),APP=P('App'),SHARE=P('Share'),FS=P('Filesystem');

/* ---------- data ---------- */
var DEF_SETTINGS={baseName:'Penygroes',baseLat:53.0560,baseLon:-4.2840,freeMiles:20,rate:0.75,hmrc:0.45,roadFactor:1.3,deliveryDays:21,groupTarget:20};
var S=null;
try{S=JSON.parse(localStorage.getItem(LS)||'null')}catch(e){S=null}
if(!S||!Array.isArray(S.weddings))S={v:1,updatedAt:0,weddings:[]};
if(!Array.isArray(S.venues))S.venues=[];
S.settings=Object.assign({},DEF_SETTINGS,S.settings||{});
var ui={view:'home',id:null,tab:'day',edit:false,msg:'',arm:null,copyText:null,img:null,venueId:null,imp:null,sunT:null,live:false,heading:null,year:null,wxBusy:false};

var VENUES=[
['Caernarfon Castle',53.1393,-4.2768],['Pwllheli',52.8886,-4.4176],['Penygroes',53.0560,-4.2840],['Llanberis / Llyn Padarn',53.1190,-4.1300],
['Nant Gwrtheyrn',52.9730,-4.4580],['Portmeirion',52.9135,-4.0988],['Criccieth',52.9177,-4.2340],['Abersoch',52.8240,-4.5050],
['Bangor',53.2274,-4.1293],['Beaumaris',53.2636,-4.0907],['Conwy',53.2800,-3.8290],['Llandudno',53.3240,-3.8270],
['Betws-y-Coed',53.0930,-3.8000],['Porthmadog',52.9280,-4.1330],['Dinas Dinlle',53.0830,-4.3350],['Rhosneigr',53.2290,-4.5080]
];
var TPL={
ceremony:{label:'Ceremony (about 2 hours)',items:[[-30,'Arrive, meet registrar, check light and rules',''],[-20,'Venue details and guests arriving',''],[-10,'Couple arrival / getting into position',''],[0,'Ceremony','Vows, rings, first kiss, signing'],[30,'Congratulations and confetti',''],[45,'Family groups','Have a helper gathering people'],[65,'Couple portraits',''],[90,'Candids and finish','']]},
half:{label:'Half day (about 4 hours)',items:[[-60,'Arrive, venue and detail shots',''],[-40,'Guests arriving, candids',''],[-10,'Couple arrival / entrance',''],[0,'Ceremony','Vows, rings, first kiss, signing'],[30,'Congratulations and confetti',''],[45,'Family groups','6–8 combinations, about 20 min'],[65,'Couple portraits','25–30 min while the light is good'],[95,'Drinks reception candids',''],[120,'Call to meal / room details',''],[150,'Speeches or meal',''],[180,'Coverage ends','']]},
full:{label:'Full day (about 8 hours)',items:[[-180,'Prep: getting ready, details, outfits',''],[-120,'Prep: other half of the couple',''],[-60,'Venue and ceremony room details',''],[-30,'Guests arriving',''],[-10,'Couple arrival / entrance',''],[0,'Ceremony','Vows, rings, first kiss, signing'],[30,'Congratulations and confetti',''],[45,'Family groups',''],[75,'Couple portraits',''],[105,'Drinks reception candids',''],[135,'Room details, call to meal',''],[150,'Wedding breakfast',''],[210,'Speeches',''],[255,'Cake cutting',''],[285,'First dance',''],[300,'Dance floor',''],[330,'Coverage ends','']]}
};
function groupTpl(a,b){a=a||'Partner 1';b=b||'Partner 2';return [
['Couple with '+a+"'s parents",''],['Couple with '+a+"'s immediate family",''],['Couple with '+b+"'s parents",''],['Couple with '+b+"'s immediate family",''],
['Couple with both families',''],['Couple with grandparents',''],['Wedding party',''],['Everyone','']]}
var SHOTS=['Rings and details','Outfits and flowers','Entrance / walking in','Vows','Ring exchange','First kiss','Signing the register','Confetti','Grandparents with the couple','Couple portraits in best light','Room and table details','Cake','First dance'];
var KIT=['Batteries charged (plus spares)','Memory cards formatted (plus spares)','Lenses cleaned','Flash and charged batteries','Lens cloth and rain cover','Umbrella','Printed timeline and group list','Venue address and parking checked','Water and snacks','Phone charged'];
function afterTpl(){var d=+S.settings.deliveryDays||21;return [
['Back up the cards to two places',0],['Send a few sneak peeks',2],['Cull and edit the gallery',Math.max(3,d-7)],['Deliver the gallery',d],['Ask for a Google review',d+3],['Send the venue a few images (with credit)',d+7],['Write the blog post',d+14],['Format the cards once the backups are checked',d+1]
].sort(function(x,y){return x[1]-y[1]}).map(function(x){return {id:uid(),text:x[0],offset:x[1],done:false}})}

/* ---------- helpers ---------- */
function toMin(t){if(!t)return null;var p=String(t).split(':');return (+p[0])*60+(+p[1])}
function fromMin(m){m=((Math.round(m)%1440)+1440)%1440;var h=Math.floor(m/60),mm=m%60;return pad(h)+':'+pad(mm)}
function pad(n){return (n<10?'0':'')+n}
function dstr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function todayStr(){return dstr(new Date())}
function addDays(s,n){var d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return dstr(d)}
function nowMin(){var d=new Date();return d.getHours()*60+d.getMinutes()}
function niceDate(s,long){if(!s)return 'No date';var d=new Date(s+'T12:00:00');return d.toLocaleDateString('en-GB',long?{weekday:'long',day:'numeric',month:'long',year:'numeric'}:{weekday:'short',day:'numeric',month:'short',year:'numeric'})}
function shortDate(s){var d=new Date(s+'T12:00:00');return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}
function daysUntil(s){if(!s)return null;var a=new Date(todayStr()+'T12:00:00'),b=new Date(s+'T12:00:00');return Math.round((b-a)/86400000)}
function names(c){var p=String(c||'').split(/\s*(?:&|\+|\band\b)\s*/i).filter(Boolean);return [p[0]||'',p[1]||'']}
function W(){for(var i=0;i<S.weddings.length;i++)if(S.weddings[i].id===ui.id)return S.weddings[i];return null}
function V(id){for(var i=0;i<S.venues.length;i++)if(S.venues[i].id===id)return S.venues[i];return null}
function sortTimeline(w){w.timeline.sort(function(a,b){return (toMin(a.time)||0)-(toMin(b.time)||0)})}
function money(n){return '£'+(Math.round(n*100)/100).toFixed(2)}
function done(x){return x.done}
function migrate(w){
  if(!w.alerts)w.alerts={on:false,mins:10,golden:true};
  if(!Array.isArray(w.after))w.after=afterTpl();
  ['timeline','groups','shots','kit','contacts'].forEach(function(k){if(!Array.isArray(w[k]))w[k]=[]});
  if(w.wet==null)w.wet='';
  return w;
}
S.weddings.forEach(migrate);
function loc(w){var v=w.venueId&&V(w.venueId);if(v&&v.lat!=null)return {lat:v.lat,lon:v.lon,name:v.name};return {lat:w.lat,lon:w.lon,name:w.venue}}

/* ---------- sun ---------- */
var RAD=Math.PI/180;
function sunAt(dateStr,lat,lon,alt){
  if(!dateStr||lat==null||lon==null||isNaN(lat)||isNaN(lon))return null;
  var p=dateStr.split('-');
  var jd=Date.UTC(+p[0],+p[1]-1,+p[2],12)/86400000+2440587.5;
  var n=Math.round(jd-2451545.0),js=n-lon/360;
  var M=(357.5291+0.98560028*js)%360;
  var C=1.9148*Math.sin(M*RAD)+0.02*Math.sin(2*M*RAD)+0.0003*Math.sin(3*M*RAD);
  var L=(M+C+180+102.9372)%360;
  var jt=2451545.0+js+0.0053*Math.sin(M*RAD)-0.0069*Math.sin(2*L*RAD);
  var sd=Math.sin(L*RAD)*Math.sin(23.4397*RAD),cd=Math.cos(Math.asin(sd));
  var cw=(Math.sin(alt*RAD)-Math.sin(lat*RAD)*sd)/(Math.cos(lat*RAD)*cd);
  if(cw<-1||cw>1)return null;
  var w=Math.acos(cw)/RAD;
  function t(j){return new Date((j-2440587.5)*86400000)}
  return {rise:t(jt-w/360),set:t(jt+w/360)};
}
function sunPos(date,lat,lon){
  var d=date.getTime()/86400000-10957.5;
  var M=RAD*(357.5291+0.98560028*d);
  var C=RAD*(1.9148*Math.sin(M)+0.02*Math.sin(2*M)+0.0003*Math.sin(3*M));
  var L=M+C+RAD*102.9372+Math.PI,e=RAD*23.4397;
  var dec=Math.asin(Math.sin(e)*Math.sin(L)),ra=Math.atan2(Math.sin(L)*Math.cos(e),Math.cos(L));
  var phi=RAD*lat,H=RAD*(280.16+360.9856235*d)-RAD*(-lon)-ra;
  var az=Math.atan2(Math.sin(H),Math.cos(H)*Math.sin(phi)-Math.tan(dec)*Math.cos(phi));
  var alt=Math.asin(Math.sin(phi)*Math.sin(dec)+Math.cos(phi)*Math.cos(dec)*Math.cos(H));
  return {alt:alt/RAD,az:((az/RAD)+180+360)%360};
}
var DIRS=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
function dirName(az){return DIRS[Math.round(az/22.5)%16]}
function fmtT(d){return d?d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/London'}):'–'}
function light(w){
  var l=loc(w),s=sunAt(w.date,l.lat,l.lon,-0.833),g=sunAt(w.date,l.lat,l.lon,6),b=sunAt(w.date,l.lat,l.lon,-6);
  if(!s)return null;
  return {sunrise:fmtT(s.rise),golden:g?fmtT(g.set):'–',goldenD:g?g.set:null,sunset:fmtT(s.set),sunsetD:s.set,blue:b?fmtT(b.set):'–'};
}
function at(dateStr,time){if(!dateStr||!time)return null;var d=new Date(dateStr+'T'+time+':00');return isNaN(d)?null:d}

/* ---------- distance ---------- */
function crow(lat1,lon1,lat2,lon2){var R=3958.8,a=Math.sin((lat2-lat1)*RAD/2),b=Math.sin((lon2-lon1)*RAD/2);var h=a*a+Math.cos(lat1*RAD)*Math.cos(lat2*RAD)*b*b;return 2*R*Math.asin(Math.sqrt(h))}
function milesOneWay(w){
  if(w.miles!=null&&w.miles!==''&&!isNaN(+w.miles))return {m:+w.miles,est:false};
  var l=loc(w),s=S.settings;if(l.lat==null)return null;
  return {m:Math.round(crow(s.baseLat,s.baseLon,l.lat,l.lon)*(+s.roadFactor||1.3)),est:true};
}
function travelCharge(m){var s=S.settings;return Math.max(0,m-(+s.freeMiles||0))*(+s.rate||0)*2}

/* ---------- storage + alerts ---------- */
function persist(){S.updatedAt=Date.now();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){ui.msg='Couldn’t save to the phone’s storage. Share a backup to be safe.'}}
function touch(){persist();schedule()}
var schedT=null;
function schedule(){clearTimeout(schedT);schedT=setTimeout(doSchedule,800)}
function doSchedule(){
  if(!LN)return;
  var list=[],id=1,now=Date.now();
  function add(t,title,body){if(t&&t.getTime()>now+5000&&id<450)list.push({id:id++,title:title,body:body,smallIcon:'ic_stat_ob',schedule:{at:t,allowWhileIdle:true}})}
  S.weddings.forEach(function(w){
    if(!w.alerts||!w.alerts.on)return;
    var m=+w.alerts.mins||10;
    w.timeline.forEach(function(x){
      if(x.done)return;var d=at(w.date,x.time);if(!d)return;
      add(new Date(d.getTime()-m*60000),x.title+' at '+x.time,'In '+m+' min · '+w.couple+(x.note?' · '+x.note:''));
    });
    if(w.alerts.golden){var l=light(w);if(l&&l.goldenD)add(new Date(l.goldenD.getTime()-15*60000),'Golden hour in 15 min','Starts '+l.golden+', sunset '+l.sunset+' · '+w.couple)}
    w.after.forEach(function(x){if(x.done||!w.date)return;add(at(addDays(w.date,+x.offset||0),'09:00'),x.text,w.couple+' · due today')});
  });
  LN.getPending().then(function(p){var c=(p&&p.notifications||[]).map(function(n){return {id:n.id}});return c.length?LN.cancel({notifications:c}):null})
  .catch(function(){}).then(function(){return list.length?LN.schedule({notifications:list}):null}).catch(function(e){ui.msg='Couldn’t set alerts: '+(e&&e.message||e);render()});
}
function ensurePerm(){
  if(!LN)return Promise.resolve(false);
  return LN.checkPermissions().then(function(p){if(p.display==='granted')return true;return LN.requestPermissions().then(function(r){return r.display==='granted'})}).catch(function(){return false});
}

/* ---------- sharing ---------- */
function shareText(title,text){
  ui.copyText=null;
  if(SHARE)return SHARE.share({title:title,text:text}).catch(function(e){if(!/cancel/i.test(String(e&&e.message||e)))copy(text)});
  copy(text);
}
function copy(text){
  try{navigator.clipboard.writeText(text).then(function(){ui.msg='Copied.';render()},function(){ui.copyText=text;render()})}catch(e){ui.copyText=text;render()}
}
function shareFile(name,base64,mime,title){
  if(SHARE&&FS){
    return FS.writeFile({path:name,data:base64,directory:'CACHE'}).then(function(r){return SHARE.share({title:title,files:[r.uri]})})
    .catch(function(e){if(!/cancel/i.test(String(e&&e.message||e))){ui.msg='Couldn’t share: '+(e&&e.message||e);render()}});
  }
  return null;
}
function b64(str){return btoa(unescape(encodeURIComponent(str)))}

/* ---------- create ---------- */
function makeWedding(f){
  var sv=f.saved?V(f.saved):null,v=VENUES[+f.venue]||null,ab=names(f.couple),c=toMin(f.ceremony)||toMin('13:00'),t=TPL[f.pkg]||TPL.half;
  var w={id:uid(),couple:f.couple||'New couple',date:f.date||'',venueId:sv?sv.id:null,
    venue:sv?sv.name:(f.venueName||(v?v[0]:'')),lat:sv?sv.lat:(v?v[1]:null),lon:sv?sv.lon:(v?v[2]:null),
    pkg:f.pkg,notes:'',wet:'',created:Date.now(),alerts:{on:false,mins:10,golden:true},
    timeline:t.items.map(function(x){return {id:uid(),time:fromMin(c+x[0]),title:x[1],note:x[2],done:false}}),
    groups:groupTpl(ab[0],ab[1]).map(function(x){return {id:uid(),title:x[0],people:x[1],done:false}}),
    shots:SHOTS.map(function(x){return {id:uid(),text:x,done:false}}),
    kit:KIT.map(function(x){return {id:uid(),text:x,done:false}}),
    after:afterTpl(),
    contacts:[{id:uid(),role:'Couple',name:f.couple||'',phone:''},{id:uid(),role:'Venue coordinator',name:'',phone:''},{id:uid(),role:'Group photo helper',name:'',phone:''}]};
  S.weddings.push(w);touch();return w;
}

/* ---------- questionnaire import ---------- */
var PHONE=/(\+44\s?\(?0?\)?\s?7\d{3}|\b07\d{3})[\s-]?\d{3}[\s-]?\d{3}\b|(\+44\s?\(?0?\)?\s?[12]\d{2,3}|\b0[12]\d{2,3})[\s-]?\d{3}[\s-]?\d{3,4}\b/;
var TIME=/\b(\d{1,2})(?:[:.](\d{2}))?\s*(am|pm|a\.m\.|p\.m\.)|\b(\d{1,2})[:.](\d{2})\b/i;
function parseTime(s){
  var m=TIME.exec(s);if(!m)return null;
  var h,mm;
  if(m[1]!=null){h=+m[1];mm=+(m[2]||0);var ap=m[3].toLowerCase().charAt(0);if(ap==='p'&&h<12)h+=12;if(ap==='a'&&h===12)h=0}
  else{h=+m[4];mm=+m[5];if(h>=1&&h<=7&&!/morning/i.test(s))h+=12}
  if(h>23||mm>59)return null;
  return {time:pad(h)+':'+pad(mm),rest:s.replace(m[0],'')};
}
function clean(s){return String(s).replace(/^[\s\-–•*·\d.)(]+\s*/,'').replace(/\s+/g,' ').replace(/^[:,\-–\s]+|[:,\-–\s]+$/g,'').trim()}
function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):s}
function splitItems(lines){
  var out=[];
  lines.forEach(function(l){
    var parts=l.split(/\s*;\s*|\s+(?=\d+[.)]\s)/);
    if(parts.length===1&&/,/.test(l)&&!/\(/.test(l)&&l.split(',').length>3&&!/\bwith\b/i.test(l))parts=[l];
    parts.forEach(function(p){p=clean(p);if(p&&!/^(n\/?a|none|no|tbc|-)$/i.test(p))out.push(p)});
  });
  return out;
}
var KNOWN=[
[/^booking name/i,'booking'],[/^date\s*\/\s*time/i,'datetime'],[/^e-?mail\s*\//i,'email'],[/^both partners/i,'names'],
[/^venues?,?\s+full address/i,'venues'],[/^agreed coverage/i,'timings'],[/^approximate guest count/i,'guests'],[/^ceremony rules/i,'rules'],
[/^which moments/i,'priority'],[/^essential group/i,'groups'],[/^who can (help )?gather/i,'helper'],[/^when and where would you like (your )?couple portraits/i,'portraits'],
[/^any (details, )?surprises/i,'surprises'],[/^any practical needs/i,'practical'],[/^any access, travel/i,'access'],
[/^your names/i,'names'],[/^wedding date and ceremony/i,'datetimeC'],[/^your email address/i,'email'],[/^your contact on the day/i,'dayContact'],
[/^where is everything happening/i,'venues'],[/^what'?s the timeline/i,'timings'],[/^roughly how many guests/i,'guests'],[/^what'?s your plan if it rains/i,'wet'],
[/^who is leading your ceremony/i,'note'],[/^are there any rules about photography/i,'rules'],[/^will your ceremony be unplugged/i,'note'],[/^will any of the ceremony or speeches/i,'note'],
[/^which moments matter/i,'priority'],[/^who are the key people/i,'keyPeople'],[/^which group photographs/i,'groups'],[/^what style or feel/i,'note'],
[/^will any other photographers/i,'note'],[/^for bookings over five hours/i,'meal'],[/^is there anyone who shouldn'?t be photographed/i,'practical'],[/^anything else/i,'note']];
var JUNK=/privacy notice|privacy-policy|publicity permission|promotion is requested separately|medical histories|^about others\.?$|powered by tcpdf|^ob photography$|^questionnaire$|^wedding questionnaire$|^from(\s+to)?$|^to$|^ob photography\s{2,}|^page \d+|^please complete this questionnaire|^applies to your booked coverage|^package, price or coverage|^(you and your booking|the day|the ceremony|photographs|practical)$/i;
function noAns(s){return /^(n\/?a|none|no|nope|tbc|tba|not sure|not applicable|-+)\.?$/i.test(String(s).trim())}
function parseQuestionnaire(text,booking){
  var lines=String(text||'').replace(/\r/g,'').replace(/’/g,"'").split('\n').map(function(l){return l.replace(/\s{2,}/g,'  ').trim()}).filter(Boolean);
  var blocks=[],cur=null,cont=false;
  lines.forEach(function(l){
    if(JUNK.test(l)){cont=false;return}
    if(cont&&cur){cur.q+=' '+l;cont=!/[.?]\s*$/.test(l);return}
    var bare=l.replace(/^\d+[.)]\s*/,''),kind=null;
    for(var i=0;i<KNOWN.length;i++)if(KNOWN[i][0].test(bare)){kind=KNOWN[i][1];break}
    if(kind||(/\?\s*$/.test(l)&&l.length<220)){cur={q:bare,kind:kind,a:[]};blocks.push(cur);cont=/\?/.test(l)&&!/[.?]\s*$/.test(l);return}
    cont=false;
    if(!cur){cur={q:'',kind:null,a:[]};blocks.push(cur)}
    cur.a.push(l);
  });
  var R={contacts:[],timeline:[],groups:[],shots:[],notes:[],date:null,wet:''},seenPhone={},bookingName='';
  function short(q){return String(q||'').replace(/\?.*$/,'?').replace(/\s+/g,' ').trim()}
  function note(b,body){var t=body.join('\n').trim();if(t&&!noAns(t))R.notes.push(b.q?short(b.q)+'\n'+t:t)}
  function addContact(line,role,fallbackName){
    var m=PHONE.exec(line);if(!m)return false;var ph=m[0];
    var num=ph.replace(/[^\d+]/g,'');if(seenPhone[num])return true;seenPhone[num]=1;
    var nm=clean(line.replace(ph,'').replace(/[\w.+-]+@[\w-]+\.[\w.]+/g,'').replace(/\b(mobile|mob|tel|phone|number|no\.?)\b[:.]?/ig,'').replace(/[(),]/g,' '));
    var r=role,rm=/^([^:\-–]+?)\s*[:\-–]\s*(.+)$/.exec(nm);
    if(rm&&rm[1].split(' ').length<=4){r=cap(rm[1]);nm=rm[2]}
    R.contacts.push({role:r||'Contact',name:nm||fallbackName||'',phone:ph.trim()});return true;
  }
  function list(body){return splitItems(body).filter(function(x){return !noAns(x)})}
  function times(body,deflt){
    var out=[];body.forEach(function(l){var t=parseTime(l);if(t){var title=clean(t.rest);var F=/^(ish|approx(imately)?\.?|around|about|at|from|until|roughly|circa|-|\u2013)\s+|\s+(ish|approx(imately)?\.?|around|about|at|from|until|roughly|circa)$/i;for(var z=0;z<4;z++)title=clean(title.replace(F,' '));if(/^(ish|approx\.?|approximately)$/i.test(title))title='';out.push({time:t.time,title:cap(title)||deflt})}});return out;
  }
  function generic(b){
    var q=b.q.toLowerCase(),body=b.a;
    var role=/coordinator|venue/.test(q)?'Venue coordinator':/helper|gather|usher/.test(q)?'Group photo helper':/approve|extra time/.test(q)?'Approves extra time':/day|contact/.test(q)?'Contact on the day':'';
    var phoneHit=false;body.forEach(function(l){if(addContact(l,role))phoneHit=true});
    var rest=body.filter(function(l){return !PHONE.test(l)});
    if(/group|combination|family photo|formal/.test(q)){list(rest).forEach(function(it){var m=/^(.+?)\s*[:–-]\s+(.+)$/.exec(it);R.groups.push(m?{title:cap(m[1]),people:m[2]}:{title:cap(it),people:''})});return}
    if(/must|shot|important|special|meaningful|don.t miss|surprise|detail|priorit/.test(q)&&!/time/.test(q)){list(rest).forEach(function(it){R.shots.push({text:cap(it)})});return}
    var timeQ=/time|timeline|running order|schedule|when|start|arriv|order of the day/.test(q);
    var tl=times(rest,'');
    if(tl.length&&(timeQ||tl.length>1)){
      var qt=cap(clean(clean(b.q).replace(/\?$/,'').replace(/^(what|when)\s+(time\s+)?(is|does|will|do|are)\s+(the\s+|your\s+|you\s+)?/i,'').replace(/\s*\b(start|begin|happen|be|planned|planning)s?\b\s*$/i,'')));
      tl.forEach(function(x){R.timeline.push({time:x.time,title:x.title||qt||'Timeline item'})});
      var left=rest.filter(function(l){return !parseTime(l)});
      if(left.length&&b.q)R.notes.push(short(b.q)+'\n'+left.join(' '));
      return;
    }
    if(!b.q&&rest.length===1&&rest[0].length<40)return;
    if(rest.length&&!(phoneHit&&!rest.join('').trim())){var ans=rest.join('\n');if(noAns(ans))return;R.notes.push(b.q?short(b.q)+'\n'+ans:ans)}
  }
  blocks.forEach(function(b){
    var body=b.a.filter(function(l){return !noAns(l)});

      case 'datetime':
        var dm=/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/.exec(body.join(' '));
        if(dm){var yy=+dm[3];if(yy<100)yy+=2000;R.date=yy+'-'+pad(+dm[2])+'-'+pad(+dm[1])}
        times(body.map(function(l){return l.replace(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/g,'')}),'').forEach(function(x){R.timeline.push({time:x.time,title:'Start (approx.)'})});
        note(b,body);return;
      case 'datetimeC':
        var dm2=/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/.exec(body.join(' '));
        if(dm2){var y2=+dm2[3];if(y2<100)y2+=2000;R.date=y2+'-'+pad(+dm2[2])+'-'+pad(+dm2[1])}
        times(body.map(function(l){return l.replace(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/g,'')}),'').forEach(function(x){R.timeline.push({time:x.time,title:'Ceremony'})});
        note(b,body);return;
      case 'dayContact':
        var anyC=false;body.forEach(function(l){if(addContact(l,'Contact on the day'))anyC=true});
        if(!anyC){var cn=clean(body.join(', '));if(cn)R.contacts.push({role:'Contact on the day',name:cn,phone:''})}
        return;
      case 'wet':
        var wt=body.join('\n').trim();if(wt&&!noAns(wt))R.wet=wt;return;
      case 'meal':
        times(body,'').forEach(function(x){R.timeline.push({time:x.time,title:'Meal break'})});
        note(b,body);return;
      case 'keyPeople':
        body.forEach(function(l){addContact(l,'Key person')});
        note(b,body.filter(function(l){return !PHONE.test(l)}));return;
      case 'note':
        note(b,body);return;
      case 'email':
        body.forEach(function(l){addContact(l,'Couple',bookingName||booking||'')});
        var em=/[\w.+-]+@[\w-]+\.[\w.]+/.exec(body.join(' '));if(em)R.notes.push('Email\n'+em[0]);return;
      case 'timings':
        times(body,'').forEach(function(x){R.timeline.push({time:x.time,title:x.title||'Coverage starts'})});
        note(b,body);return;
      case 'guests':case 'access':case 'rules':case 'names':case 'venues':case 'portraits':
        body.forEach(function(l){addContact(l,b.kind==='guests'?'Contact on the day':'Contact')});
        note(b,body.filter(function(l){return !PHONE.test(l)}));return;
      case 'practical':

      case 'priority':case 'surprises':

      case 'groups':

      case 'helper':
        var any=false;body.forEach(function(l){if(addContact(l,'Group photo helper'))any=true});

  return R;
}
function pdfText(file){
  return import('./pdfjs/pdf.min.js').then(function(lib){
    lib.GlobalWorkerOptions.workerSrc='./pdfjs/pdf.worker.min.js';
    return file.arrayBuffer().then(function(buf){return lib.getDocument({data:new Uint8Array(buf)}).promise});
  }).then(function(doc){
    var pages=[];for(var i=1;i<=doc.numPages;i++)pages.push(i);
    return Promise.all(pages.map(function(n){return doc.getPage(n).then(function(pg){return pg.getTextContent()})})).then(function(cs){
      return cs.map(function(c){
        var rows=[];
        c.items.forEach(function(it){if(!it.str||!it.str.trim())return;var y=it.transform[5],x=it.transform[4],r=null;
          for(var k=0;k<rows.length;k++)if(Math.abs(rows[k].y-y)<3){r=rows[k];break}
          if(!r){r={y:y,parts:[]};rows.push(r)}r.parts.push({x:x,s:it.str})});
        rows.sort(function(a,b){return b.y-a.y});
        return rows.map(function(r){r.parts.sort(function(a,b){return a.x-b.x});return r.parts.map(function(p){return p.s}).join('  ')}).join('\n');
      }).join('\n');
    });
  });
}

function compassSvg(az,alt,setAz,rot){
  var r=58,c=70,rotate=rot||0;
  function pt(a,rr){return [c+rr*Math.sin(a*RAD),c-rr*Math.cos(a*RAD)]}
  var s=pt(az,r-6),ss=setAz!=null?pt(setAz,r+2):null,up=alt>0;
  var h='<svg width="140" height="140" viewBox="0 0 140 140" aria-label="Sun direction"><g transform="rotate('+(-rotate)+' 70 70)">';
  h+='<circle cx="70" cy="70" r="'+r+'" fill="#fff" stroke="#E6D6BA" stroke-width="2"/>';
  ['N','E','S','W'].forEach(function(d,i){var p=pt(i*90,r-14);h+='<text x="'+p[0]+'" y="'+(p[1]+5)+'" text-anchor="middle" font-size="13" font-weight="600" fill="'+(d==='N'?'#B5523B':'#6E6A64')+'" transform="rotate('+rotate+' '+p[0]+' '+p[1]+')">'+d+'</text>'});
  if(ss)h+='<circle cx="'+ss[0]+'" cy="'+ss[1]+'" r="4" fill="#B5523B" opacity=".8"/>';
  h+='<line x1="70" y1="70" x2="'+s[0]+'" y2="'+s[1]+'" stroke="'+(up?'#A88241':'#9BA7B3')+'" stroke-width="3" stroke-linecap="round"/>';
  h+='<circle cx="'+s[0]+'" cy="'+s[1]+'" r="9" fill="'+(up?'#E3B04B':'#9BA7B3')+'" stroke="#fff" stroke-width="2"/>';
  h+='<circle cx="70" cy="70" r="4" fill="#1A1A1A"/></g></svg>';
  return h;
}
function rLight(w){

    if(R2.wet&&!R2.wetOff)w.wet=(w.wet?w.wet+'\n\n':'')+R2.wet;
    var nt=pick('notes');if(nt.length)w.notes=(w.notes?w.notes+'\n\n':'')+nt.map(function(x){return x.text}).join('\n\n');
    ui.imp=null;ui.view='wed';ui.tab='day';ui.msg='Added from the questionnaire. Check the People, Groups and Notes tabs.';touch();window.scrollTo(0,0);return render();
  }
  if(a==='delw'){
    if(ui.arm!=='delw'){ui.arm='delw';return render()}
    S.weddings=S.weddings.filter(function(x){return x.id!==ui.id});ui.arm=null;ui.view='home';touch();return render();
  }
});
app.addEventListener('change',function(ev){
  var el=ev.target;
  if(el.id==='qpdf'&&el.files&&el.files[0]){var wq=W();if(!wq)return;ui.pdfBusy=true;ui.msg='';render();
    pdfText(el.files[0]).then(function(t){if(!t.trim())throw new Error('empty');showImport(t,wq)}).catch(function(e){console.log('PDFERR '+(e&&e.message));ui.pdfBusy=false;ui.msg='Couldn’t read that PDF. Try copying and pasting the text instead.';render()});return}
  if(el.dataset.set){var s=S.settings,k=el.dataset.set;s[k]=k==='baseName'?el.value:(isNaN(parseFloat(el.value))?DEF_SETTINGS[k]:parseFloat(el.value));persist();return render()}
  if(el.dataset.vf){
    var v=V(ui.venueId);if(!v)return;var f=el.dataset.vf;
    if(f==='area'){var ar=VENUES[+el.value];if(el.value!==''&&ar){v.lat=ar[1];v.lon=ar[2];if(!v.name)v.name=ar[0]}}
    else if(f==='lat'||f==='lon'){var num=parseFloat(String(el.value).replace(',','.'));v[f]=isNaN(num)?null:num}
    else v[f]=el.value;
    S.weddings.forEach(function(x){if(x.venueId===v.id){x.venue=v.name;x.lat=v.lat;x.lon=v.lon}});
    persist();if(f==='area'||f==='name'||f==='lat'||f==='lon')render();return;
  }
  if(el.dataset.pick&&ui.imp){ui.imp[el.dataset.pick][+el.dataset.ix].off=!el.checked;return}
  if(el.dataset.wetpick&&ui.imp){ui.imp.wetOff=!el.checked;return}
  if(el.dataset.rep&&ui.imp){ui.imp['rep_'+el.dataset.rep]=el.checked;return}
  var w=W();if(!w)return;
  if(el.dataset.sun){ui.sunT=el.value;return render()}
  if(el.dataset.al){w.alerts[el.dataset.al]=+el.value;touch();return render()}
  if(el.dataset.w){
    var fw=el.dataset.w,val=el.value;
    if(fw==='where'){setWhere(w,val);touch();return render()}
    if(fw==='lat'||fw==='lon'){var nn=parseFloat(String(val).replace(',','.'));w[fw]=isNaN(nn)?null:nn;w.weather=null}
    else if(fw==='miles'){w.miles=val===''?null:+val}
    else if(fw==='date'){w.date=val;w.weather=null}
    else w[fw]=val;
    touch();if(fw!=='notes'&&fw!=='wet')render();
    return;
  }
  if(el.dataset.k&&el.dataset.i&&el.dataset.f){var it=find(w,el.dataset.k,el.dataset.i);if(it){it[el.dataset.f]=el.dataset.f==='offset'?(+el.value||0):el.value;touch()}}
});
app.addEventListener('input',function(ev){
  var el=ev.target,w=W();
  if(w&&(el.dataset.w==='notes'||el.dataset.w==='wet')){w[el.dataset.w]=el.value;persist();return}
  if(el.dataset.vf&&el.tagName==='TEXTAREA'){var v=V(ui.venueId);if(v){v[el.dataset.vf]=el.value;persist()}}
});
app.addEventListener('submit',function(ev){
  ev.preventDefault();var fd=new FormData(ev.target),f={};fd.forEach(function(v,k){f[k]=v});
  if(f.where&&f.where.indexOf('v:')===0)f.saved=f.where.slice(2);else if(f.where&&f.where.indexOf('a:')===0)f.venue=f.where.slice(2);
  var w=makeWedding(f);openWed(w.id);
});
setInterval(function(){
  var w=W();if(ui.view!=='wed'||!w)return;
  if(ui.tab==='groups'&&w.groupTimer&&w.groupTimer.start&&!w.groupTimer.end){var el=(Date.now()-w.groupTimer.start)/1000,g=document.getElementById('gtimer');if(g){g.textContent=Math.floor(el/60)+':'+pad(Math.floor(el%60));g.className='timer'+(el>(+S.settings.groupTarget||20)*60?' warn':'')}}
},1000);
setInterval(function(){var w=W();if(ui.view==='wed'&&ui.tab==='day'&&!ui.edit&&w&&w.date===todayStr()&&!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||''))render()},30000);
if(APP){
  APP.addListener('backButton',function(){
    if(ui.arm){ui.arm=null;return render()}
    if(ui.view==='import'){if(ui.imp){ui.imp=null;return render()}ui.view='wed';return render()}
    if(ui.view==='venue'){ui.view=ui.retWed?'wed':'venues';return render()}
    if(ui.view==='wed'&&ui.edit){var w=W();if(w)sortTimeline(w);ui.edit=false;return render()}
    if(ui.img){ui.img=null;return render()}
    if(ui.view!=='home'){ui.view='home';ui.copyText=null;ui.live=false;stopLive();window.scrollTo(0,0);return render()}
    APP.exitApp();
  });
  APP.addListener('resume',function(){render()});
}
render();
schedule();
})();
</script></body></html>
