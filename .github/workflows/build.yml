name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Bundle fonts for offline use
        run: |
          mkdir -p www/fonts/jost www/fonts/cormorant
          cp -r node_modules/@fontsource/jost/files www/fonts/jost/
          cp -r node_modules/@fontsource/cormorant-garamond/files www/fonts/cormorant/
          for w in 400 500 600; do cp node_modules/@fontsource/jost/$w.css www/fonts/jost/; done
          for w in 500 600 500-italic; do cp node_modules/@fontsource/cormorant-garamond/$w.css www/fonts/cormorant/; done
          {
            for w in 400 500 600; do echo "@import \"jost/$w.css\";"; done
            for w in 500 600 500-italic; do echo "@import \"cormorant/$w.css\";"; done
          } > www/fonts/fonts.css

      - name: Create Android project
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --assetPath assets \
            --iconBackgroundColor '#FBF7F1' --splashBackgroundColor '#FBF7F1' --splashBackgroundColorDark '#1A1A1A'
          mkdir -p android/app/src/main/res/drawable
          cp assets/ic_stat_ob.png android/app/src/main/res/drawable/ic_stat_ob.png
          # Notification and exact-alarm permissions
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32" />\n    <application#' android/app/src/main/AndroidManifest.xml
          # Version number goes up with every build so updates install over the top
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          npx cap sync android

      - name: Build
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ks.p12
          else
            echo "::warning::No signing key secret found, using the key in the repo"
            cp signing/release.p12 ks.p12
            KS_PASS=$(cat signing/password.txt)
          fi
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks ks.p12 --ks-type PKCS12 --ks-key-alias weddingday \
            --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_PASS" --out WeddingDay.apk aligned.apk
          "$BT/apksigner" verify WeddingDay.apk
          rm -f ks.p12

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.${{ github.run_number }}" WeddingDay.apk \
            --title "Wedding Day 1.${{ github.run_number }}" \
            --notes "Install WeddingDay.apk on your Android phone. Built from ${GITHUB_SHA::7}." \
            --latest
